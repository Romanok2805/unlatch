[package]
name = "unlatch"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A small, self-hosted OpenID Connect provider for single sign-on"
license = "MIT"
repository = "https://github.com/Romanok2805/unlatch"
homepage = "https://unlatch.dev"
keywords = ["oidc", "openid-connect", "sso", "identity-provider", "authentication"]
categories = ["authentication", "web-programming::http-server"]
# What crates.io gets: the code and the files it embeds, not the tooling around it.
include = ["/src", "/assets", "/README.md", "/LICENSE"]

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
aws-lc-rs = "1.18.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
qrcodegen = "1.8.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
webpki-roots = "1.0.9"
zeroize = "1.9.1"

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
let_underscore_drop = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
# Set by cargo-fuzz; see fuzz/.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every exception to a lint is local and says why: #[expect(lint, reason = "...")].
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# No panics: see "Ground rules" in docs/architecture.md.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
# Overflow and lossy casts must be handled explicitly (checked_*, try_from).
arithmetic_side_effects = "deny"
as_conversions = "deny"
# Output goes through the logger, which writes only values our code chose.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
# Only main decides when the process ends.
exit = "deny"
mem_forget = "deny"

[profile.release]
# Small, fast binary; release build time does not matter.
lto = true
codegen-units = 1
strip = true
