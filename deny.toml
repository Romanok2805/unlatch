# Anything not allowed here fails CI. Changing this file needs a reason in the pull request.

[advisories]
ignore = []

[licenses]
# Licenses compatible with distributing Unlatch under MIT.
allow = ["MIT", "Apache-2.0", "ISC", "BSD-3-Clause", "Unicode-3.0"]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
